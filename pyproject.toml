[project]
name = "production-rag"
version = "0.1.0"
requires-python = ">=3.11"
description = "Production-ready Retrieval-Augmented Generation system"
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tools.setuptools]
package-dir = {""="src"}

[tools.setuptools.packages.find]
where = "src"
